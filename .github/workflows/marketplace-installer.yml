name: Marketplace Installer

on:
  pull_request:
    paths:
      - '.github/workflows/marketplace-installer.yml'
      - 'apps/electron/**'
      - 'packages/marketplace-domain/**'
      - 'packages/shared/**'
      - 'bun.lock'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-integration:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun 1.3.13
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 验证安装与工作区生命周期
        run: bun test apps/electron/src/main/lib/marketplace-installer.test.ts apps/electron/src/main/lib/marketplace-installer.integration.test.ts apps/electron/src/main/lib/marketplace-skill-lifecycle.test.ts apps/electron/src/main/lib/marketplace-skill-lifecycle-ipc.test.ts apps/electron/src/renderer/atoms/marketplace-atoms.test.ts apps/electron/src/renderer/components/marketplace/marketplace-agent-use.test.ts apps/electron/src/renderer/components/marketplace/MarketplaceSkillDetailPage.test.ts apps/electron/src/renderer/components/marketplace/MarketplaceUpdateSummary.test.tsx apps/electron/src/renderer/components/agent-skills/SkillCard.test.tsx

      - name: 类型检查共享契约与 Electron
        run: bun run --filter='@proma/shared' typecheck && bun run --filter='@proma/electron' typecheck
